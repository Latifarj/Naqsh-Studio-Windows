name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, master, professional-v1, technical-sheet-v1]
permissions:
  contents: write
jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Expand verified technical source update once
        if: github.ref == 'refs/heads/technical-sheet-v1'
        shell: pwsh
        run: |
          if (Test-Path 'technical-update.zip') {
            $hash = (Get-FileHash 'technical-update.zip' -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne 'a0c0cf970e41aa65a71c6a303e8080c28345a4020c129c949f84e5a84a04e9d8') { throw 'Source archive checksum mismatch' }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'technical-update.zip'))
            try {
              foreach ($entry in $zip.Entries) {
                if ($entry.FullName -match '(^/|\\|(^|/)\.\.(/|$)|^\.git/|^\.github/|:)') { throw 'Unsafe source path' }
              }
            } finally { $zip.Dispose() }
            Expand-Archive 'technical-update.zip' -DestinationPath '.' -Force
            Remove-Item 'technical-update.zip'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            git commit -m 'Publish technical-sheet 1.2 alpha source as individual files'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:technical-sheet-v1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Cairo runtime
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-cairo mingw-w64-x86_64-fribidi
      - name: Install dependencies, test, and build
        shell: pwsh
        env:
          PYTHONUTF8: 1
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $env:CAIRO_DLL_DIR = Join-Path $env:MSYS_ROOT 'mingw64/bin'
          $env:PATH = "$env:PATH;$env:CAIRO_DLL_DIR"
          python -m pip install -r requirements-dev.txt -r requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import server; from PIL import features; assert features.check('raqm'), 'RAQM/FriBidi is required for Persian labels'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          npm run build:sample
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test packaged backend and PDF
        shell: pwsh
        run: |
          $p = Start-Process -FilePath './dist/server/naqsh-server.exe' -ArgumentList '--host','127.0.0.1','--port','18765' -PassThru -RedirectStandardOutput backend-out.log -RedirectStandardError backend-error.log
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              try { $h = Invoke-RestMethod 'http://127.0.0.1:18765/api/health'; if ($h.ok -and $h.printProfile -eq 'technical-bw-v1') { $ready=$true; break } } catch {}
              if ($p.HasExited) { Get-Content backend-error.log; throw "Packaged backend exited early" }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { Get-Content backend-error.log; throw "Backend did not become ready" }
            $body = @{svg='<svg xmlns="http://www.w3.org/2000/svg" data-print-profile="technical-bw-v1" width="10mm" height="10mm" viewBox="0 0 10 10"><rect width="10" height="10" fill="red"/><text x="5" y="5" text-anchor="middle" direction="rtl" font-size="1.5" fill="#000">آستین</text></svg>'; profile='technical-bw-v1'; expected_width_mm=10; expected_height_mm=10} | ConvertTo-Json
            Invoke-WebRequest 'http://127.0.0.1:18765/api/export/pdf' -Method Post -ContentType 'application/json' -Body $body -OutFile smoke.pdf
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'smoke.pdf'))
            if ([System.Text.Encoding]::ASCII.GetString($bytes,0,4) -ne '%PDF') { throw 'Invalid PDF' }
            Write-Host 'Packaged backend health, PDF export and expected page-size check passed'
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/win/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqsh-Studio-technical-sheet-v1-Windows-x64
          path: |
            release/win/*.exe
            release/win/*.sha256
            docs/*ویندوز.fa.md
            desktop/README.fa.md
          if-no-files-found: error
          retention-days: 30
