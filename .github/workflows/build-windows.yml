name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Expand private source bundle
        shell: pwsh
        run: Expand-Archive -Path source.zip -DestinationPath . -Force
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Cairo runtime
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-cairo
      - name: Install dependencies, test, and build
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $env:CAIRO_DLL_DIR = Join-Path $env:MSYS_ROOT 'mingw64/bin'
          $env:PATH = "$env:CAIRO_DLL_DIR;$env:PATH"
          python -m pip install -r requirements-dev.txt -r requirements-desktop.txt
          npm ci
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqsh-Studio-Windows-x64
          path: |
            release/win/*.exe
            docs/*ویندوز.fa.md
          if-no-files-found: error
          retention-days: 30
