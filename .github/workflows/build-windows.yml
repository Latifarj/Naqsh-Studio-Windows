name: Expand source bundle once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  expand-source:
    if: github.event.head_commit.message == 'Expand source ZIP into reviewable files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand committed source
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '4206952f3c1a22fd06ea0a46e41de76d0a0a17da8aa8e7beee083d4d76fe17c3'
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  if path.parts[0] == '.github':
                      continue
                  target = pathlib.Path(item.filename)
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(bundle.read(item))
          archive.unlink()
      - name: Commit expanded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Track expanded project source instead of ZIP bundle'
          git push origin HEAD:main
